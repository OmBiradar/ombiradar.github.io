<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Om Biradar</title>
  <meta name="description" content="Om Biradar — data engineer and maker of things.">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --text: #f3f4f6;
      --muted: #a1a5b5;
      --accent: #7c9cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 44rem;
      text-align: center;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid #2c3142;
      color: var(--accent);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .tagline {
      margin: 0.75rem 0 0;
      color: var(--accent);
      font-size: 1.15rem;
    }

    .intro {
      margin: 1.5rem auto 0;
      max-width: 34rem;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .links a {
      padding: 0.7rem 1.3rem;
      border: 1px solid #2c3142;
      border-radius: 999px;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    footer {
      margin-top: 3.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="avatar" aria-hidden="true">OB</div>
    <h1>Hi, I'm Om Biradar.</h1>
    <p class="tagline">Data engineer. Curious builder.</p>
    <p class="intro">
      I work as a data engineer at NatWest Group and spend my free time
      exploring things that interest me. Thanks for stopping by.
    </p>
    <nav class="links" aria-label="Contact and social links">
      <a href="https://github.com/OmBiradar">GitHub</a>
      <a href="https://www.linkedin.com/in/om-biradar-2b4a981bb/">LinkedIn</a>
      <a href="mailto:ombiradar04@gmail.com">Email</a>
    </nav>
    <footer>&copy; 2026 Om Biradar</footer>
  </main>
</body>
</html>
